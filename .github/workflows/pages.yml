name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GATSBY_TELEMETRY_DISABLED: 1
      GATSBY_TURNSTILE_SITEKEY: 0x4AAAAAAFso8R48jtY5x9o_
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            sites/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd sites install --frozen-lockfile
      - run: yarn build
      - run: yarn --cwd sites build
      - run: cp -r sites/dist public/wzornik
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: cd3153f3d154d9d5889f96c15325cdf7
        run: |
          grep -o '<loc>[^<]*</loc>' public/sitemap-0.xml | sed 's#</\?loc>##g' \
            | jq -R . | jq -s --arg key "$INDEXNOW_KEY" \
              '{host: "adrianturbinski.pl", key: $key, keyLocation: "https://adrianturbinski.pl/\($key).txt", urlList: .}' \
            > indexnow.json
          sleep 60
          curl -sS -o /dev/null -w 'IndexNow %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json
