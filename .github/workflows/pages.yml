name: Pages

on:
  push:
    branches: [rebrand-2026]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GATSBY_TELEMETRY_DISABLED: 1
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            sites/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd sites install --frozen-lockfile
      - run: yarn build
      - run: yarn --cwd sites build
      - run: cp -r sites/dist public/wzornik
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
