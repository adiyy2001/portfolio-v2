<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<title>Skibka animacja</title>
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#f2ede2}
.stage{position:relative;width:1080px;height:1080px;background:#f2ede2}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
img{position:absolute;display:block}
#stamp{left:290px;top:290px;width:500px;height:500px;opacity:0;transform-origin:50% 50%}
#lockup{left:190px;top:340px;width:700px;opacity:0;transform-origin:50% 50%}
#ring{position:absolute;left:290px;top:290px;width:500px;height:500px;border-radius:50%;border:6px solid #8f5530;opacity:0;box-sizing:border-box}
</style>
<body>
<div class="stage" id="stage">
<svg class="grain" width="1080" height="1080" aria-hidden="true"><filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .23 0 0 0 0 .19 0 0 0 0 .16 0 0 0 .9 -.25"/></filter><rect width="1080" height="1080" filter="url(#n)"/></svg>
<div id="ring"></div>
<img id="stamp" alt="" src="../../../../../sites/public/identyfikacja/skibka/logo/skibka-symbol.svg">
<img id="lockup" alt="" src="../../../../../sites/public/identyfikacja/skibka/logo/skibka-vertical.svg">
</div>
<script>
const ease = 'cubic-bezier(.2,.7,.2,1)';
const run = (id, keyframes, options) => document.getElementById(id).animate(keyframes, { fill: 'both', easing: ease, ...options });
const animations = [
  run('stamp', [
    { opacity: 0, transform: 'scale(1.45) rotate(-8deg)', filter: 'blur(14px)', offset: 0 },
    { opacity: 1, transform: 'scale(0.96) rotate(-2deg)', filter: 'blur(0px)', offset: 0.55 },
    { opacity: 1, transform: 'scale(1) rotate(-3deg)', filter: 'blur(0px)', offset: 1 },
  ], { duration: 900, delay: 100 }),
  run('ring', [
    { opacity: 0.55, transform: 'scale(0.9)', offset: 0 },
    { opacity: 0, transform: 'scale(1.32)', offset: 1 },
  ], { duration: 800, delay: 560, fill: 'forwards' }),
  run('stamp', [
    { opacity: 1, transform: 'scale(1) rotate(-3deg)', offset: 0 },
    { opacity: 0, transform: 'scale(0.82) translateY(-30px) rotate(0deg)', offset: 1 },
  ], { duration: 400, delay: 1700, easing: 'ease-in-out', fill: 'forwards' }),
  run('lockup', [
    { opacity: 0, transform: 'translateY(34px) scale(0.94)', offset: 0 },
    { opacity: 1, transform: 'translateY(0) scale(1)', offset: 1 },
  ], { duration: 700, delay: 2100 }),
];
window.__duration = 3000;
animations.forEach(animation => animation.pause());
window.__seek = ms => {
  animations.forEach(animation => {
    animation.currentTime = ms;
  });
};
window.__seek(0);
</script>
